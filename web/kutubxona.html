<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alif+ — Yangi Alifbo Kutubxonasi</title>
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      var s = localStorage.getItem("alif_theme") || localStorage.getItem("theme");
      var m = (q === "dark" || q === "light") ? q : ((s === "dark" || s === "light") ? s : "light");
      document.documentElement.setAttribute("data-theme", m);
    })();
  </script>
  <style>
    :root { --bg:#faf9f6; --card:#ffffff; --text:#0f172a; --muted:#475569; --accent:#4338ca; --green:#4338ca; --border:#e4e2dc; }
    html[data-theme="dark"] { --bg:#0c0f14; --card:#141821; --text:#f1f5f9; --muted:#94a3b8; --accent:#818cf8; --green:#4338ca; --border:#283040; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,"Times New Roman",serif; background:var(--bg); color:var(--text); line-height:1.85; }
    .wrap { max-width:860px; margin:0 auto; padding:28px 20px 72px; }
    .topbar { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
    .topbar a { color:var(--accent); text-decoration:none; font-weight:700; font-size:14px; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .btn { padding:7px 13px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:600; font-size:13px; cursor:pointer; }
    .btn:hover, .btn.active { background:var(--green); border-color:var(--green); color:#ffffff; }
    .reader { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; font-size:19px; }
    .reader h1 { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0 0 6px; font-size:26px; }
    .author { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--muted); font-size:14px; margin-bottom:22px; }
  </style>
  <script>
    window.toggleAlifTheme = function() {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("alif_theme", next);
      localStorage.setItem("theme", next);
    };
  </script>
  <link rel="stylesheet" href="converter.css?v=26" />
  <link rel="stylesheet" href="theme-variants.css?v=3" />
</head>
<body>
  <header class="alif-topbar">
    <div class="alif-container alif-topbar-inner">
      <a href="../index.html" class="alif-brand">
        <img src="../icon.png" alt="Alif+" style="width:34px; height:34px; border-radius:10px;">
        <span class="alif-brand-text">Alif+</span>
      </a>
      <nav class="alif-nav" aria-label="Asosiy menyu">
        <a href="../index.html" class="alif-nav-link">Bosh sahifa</a>
        <a href="../alifbo.html" class="alif-nav-link">Alifbo</a>
        <a href="../konverter.html" class="alif-nav-link">Konverter</a>
        <a href="../hujjatlar.html" class="alif-nav-link">Hujjatlar</a>
        <a href="../mashq.html" class="alif-nav-link">Mashq</a>
        <a href="../ilovalar.html" class="alif-nav-link">Ilovalar</a>
        <button type="button" id="alifThemeToggle" class="alif-theme-btn" onclick="toggleAlifTheme()" aria-label="Kundalik yoki tungi rejim" title="Kundalik / Tungi rejim">
          <svg class="alif-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="alif-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <div class="topbar">
      <div style="display:flex;gap:16px;">
        <a href="../index.html" id="backHome">← Alif+ Bosh sahifa</a>
        <a href="lugat.html" id="toDict">Imlo Luğati →</a>
      </div>
      <div class="controls">
        <button type="button" class="btn active" data-book="0">Abdulla Qodiriy</button>
        <button type="button" class="btn" data-book="1">Alisher Navoiy</button>
        <button type="button" class="btn" data-book="2">Yangi Alifbo Qoidalari</button>
        <button type="button" class="btn" id="fontMinus">A−</button>
        <button type="button" class="btn" id="fontPlus">A+</button>
      </div>
    </div>

    <article class="reader" id="readerBox">
      <h1 id="bookTitle"></h1>
      <div class="author" id="bookAuthor"></div>
      <div id="bookBody"></div>
    </article>
  </div>

  <script>
    (function () {
      var mode = document.documentElement.getAttribute("data-theme") || "light";
      document.getElementById("backHome").href = "../index.html?theme=" + mode;
      document.getElementById("toDict").href = "lugat.html?theme=" + mode;

      var books = [
        {
          title: "Ötkan kunlar (parça)",
          author: "Abdulla Qodiriy — 28 harfli yangi özbek alifbosida",
          paragraphs: [
            "1264-nçi hijriy, dalv oyining ön yettinçisi, qişki kunlarning biri, quyosh botqan, tevarakdan şom azoni eşitiladir...",
            "Darbozasi şarqi-janubiyga qaratib qurilğan bu dongdor saroyni Toşkent, Samarqand va Buxoro savdogarlari egallaganlar, saroydagi bir-ikki hujrani istisno qiliş bilan boşqalari musofirlar bilan töla edi.",
            "Hujralardan birida ötirğuçi yigit — Otabek özining bosiqligi, teran fikri va odobi bilan barçaning hurmatini qozonğan edi."
          ]
        },
        {
          title: "Mahbub ul-qulubdan hikmatlar",
          author: "Alisher Navoiy — Yangi imlo talqinida",
          paragraphs: [
            "Tilga ixtiyorsiz — elga e'tiborsiz. Har kimki sözini öylab gapirsa, uning qadri baland bölar.",
            "Olim bölsang, olam seniki. Ilm va hunar örganiş har bir yigit-qizning eng şarafli burçidir.",
            "Yaxşilik qilmoq — insoniylikning eng oliy nişonasidir; elga foydasi tegmagan kişi tiriklar qatorida sanalmas."
          ]
        },
        {
          title: "28 harfli yangi özbek alifbosining afzalliklari",
          author: "Alif+ Ilmiy-amaliy qöllanma",
          paragraphs: [
            "Yangi alifboda har bir tovuşga bitta aniq harf mos keladi: O‘ → Ö, G‘ → Ğ, Sh → Ş, Ch → Ç. Bu esa öqiş tezligini oşiradi va imlo xatolarini keskin kamaytiradi.",
            "Tutuq belgisi (') faqat unlini undoshdan ajratiş uchun saqlanadi (masalan: ta'lim, e'lon, san'at, Is'hoq). Endi o' va g' harflari tutuq belgisi bilan adashtirilmaydi.",
            "Alif+ platformasi orqali siz istalgan hujjatni (.docx, .pdf, .txt) bir soniyada yangi imloga ögirişingiz va klaviaturada töğridan-töğri yozişingiz mumkin."
          ]
        }
      ];

      var size = 19;
      var reader = document.getElementById("readerBox");
      function loadBook(idx) {
        var b = books[idx];
        document.getElementById("bookTitle").textContent = b.title;
        document.getElementById("bookAuthor").textContent = b.author;
        document.getElementById("bookBody").innerHTML = b.paragraphs.map(function (p) { return "<p>" + p + "</p>"; }).join("");
      }
      document.querySelectorAll("[data-book]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("[data-book]").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          loadBook(+btn.getAttribute("data-book"));
        });
      });
      document.getElementById("fontMinus").addEventListener("click", function () { size = Math.max(15, size - 2); reader.style.fontSize = size + "px"; });
      document.getElementById("fontPlus").addEventListener("click", function () { size = Math.min(28, size + 2); reader.style.fontSize = size + "px"; });
      loadBook(0);
    })();
  </script>
  <script src="smart-engine.js?v=1121"></script>
  <script>
    (function () {
      function convertReader() {
        var reader = document.querySelector(".reader");
        if (!reader || !window.AlifSmartEngine) return;
        if (!reader.dataset.origHtml) reader.dataset.origHtml = reader.innerHTML;
        var walker = document.createTreeWalker(reader, NodeFilter.SHOW_TEXT, null, false);
        var n;
        while ((n = walker.nextNode())) {
          var p = n.parentElement;
          if (!p || /^(SCRIPT|STYLE)$/.test(p.tagName)) continue;
          if (n.nodeValue && n.nodeValue.trim()) {
            n.nodeValue = window.AlifSmartEngine.smartConvertText(n.nodeValue);
          }
        }
      }
      window.addEventListener("alif-smart-ready", convertReader);
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", convertReader);
      else convertReader();
    })();
  </script>
  <script src="theme-variants.js?v=3"></script>
</body>
</html>
